<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 50" width="100%" height="50">
  <defs>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0" />
      <stop offset="50%" stop-color="#4facfe" stop-opacity="1" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </linearGradient>
  </defs>
  <line x1="100" y1="25" x2="700" y2="25" stroke="url(#lineGrad)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="stroke-dasharray" values="0,600;600,0;0,600" dur="4s" repeatCount="indefinite" />
  </line>
  <circle cx="400" cy="25" r="5" fill="#4facfe">
    <animate attributeName="r" values="5;8;5" dur="2s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite" />
  </circle>
</svg>