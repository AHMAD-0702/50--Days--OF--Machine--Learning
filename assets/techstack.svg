<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="100%" height="200">
  <defs>
    <linearGradient id="techGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
  </defs>

  <!-- Center Hub -->
  <circle cx="500" cy="100" r="40" fill="#1e1e2f" stroke="url(#techGrad)" stroke-width="3">
    <animate attributeName="r" values="40;45;40" dur="3s" repeatCount="indefinite" />
  </circle>
  <text x="500" y="105" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#ffffff" text-anchor="middle">ML</text>

  <!-- Orbiting Tech Nodes -->
  <g>
    <animateTransform attributeName="transform" type="rotate" from="0 500 100" to="360 500 100" dur="20s" repeatCount="indefinite" />
    
    <!-- Python -->
    <circle cx="500" cy="20" r="25" fill="#1e1e2f" stroke="#3776AB" stroke-width="2" />
    <text x="500" y="25" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#3776AB" text-anchor="middle">PY</text>

    <!-- Pandas -->
    <circle cx="700" cy="100" r="25" fill="#1e1e2f" stroke="#150458" stroke-width="2" />
    <text x="700" y="105" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#150458" text-anchor="middle">PD</text>

    <!-- Scikit-Learn -->
    <circle cx="500" cy="180" r="25" fill="#1e1e2f" stroke="#F7931E" stroke-width="2" />
    <text x="500" y="185" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#F7931E" text-anchor="middle">SK</text>

    <!-- NumPy -->
    <circle cx="300" cy="100" r="25" fill="#1e1e2f" stroke="#013243" stroke-width="2" />
    <text x="300" y="105" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" fill="#013243" text-anchor="middle">NP</text>
  </g>
</svg>