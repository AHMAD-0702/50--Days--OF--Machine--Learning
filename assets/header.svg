<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29" />
      <stop offset="50%" stop-color="#302b63" />
      <stop offset="100%" stop-color="#24243e" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe">
        <animate attributeName="stop-color" values="#00f2fe;#4facfe;#00f2fe" dur="4s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#4facfe">
        <animate attributeName="stop-color" values="#4facfe;#00f2fe;#4facfe" dur="4s" repeatCount="indefinite" />
      </stop>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="100%" height="100%" fill="url(#bgGrad)" rx="15" />

  <!-- Animated Neural Network -->
  <g opacity="0.6">
    <!-- Input Layer -->
    <circle cx="200" cy="80" r="8" fill="#00f2fe">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite" begin="0s" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0s" />
    </circle>
    <circle cx="200" cy="150" r="8" fill="#00f2fe">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite" begin="0.3s" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.3s" />
    </circle>
    <circle cx="200" cy="220" r="8" fill="#00f2fe">
      <animate attributeName="r" values="8;12;8" dur="2s" repeatCount="indefinite" begin="0.6s" />
      <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite" begin="0.6s" />
    </circle>

    <!-- Hidden Layer -->
    <circle cx="400" cy="115" r="10" fill="#4facfe">
      <animate attributeName="r" values="10;14;10" dur="2s" repeatCount="indefinite" begin="0.2s" />
    </circle>
    <circle cx="400" cy="185" r="10" fill="#4facfe">
      <animate attributeName="r" values="10;14;10" dur="2s" repeatCount="indefinite" begin="0.5s" />
    </circle>

    <!-- Output Layer -->
    <circle cx="600" cy="150" r="12" fill="#00f2fe" filter="url(#glow)">
      <animate attributeName="r" values="12;16;12" dur="2s" repeatCount="indefinite" begin="0.1s" />
    </circle>

    <!-- Synapses (Data Flow) -->
    <line x1="208" y1="80" x2="390" y2="115" stroke="#00f2fe" stroke-width="2" stroke-dasharray="10,5">
      <animate attributeName="stroke-dashoffset" from="30" to="0" dur="1s" repeatCount="indefinite" />
    </line>
    <line x1="208" y1="150" x2="390" y2="115" stroke="#00f2fe" stroke-width="2" stroke-dasharray="10,5">
      <animate attributeName="stroke-dashoffset" from="30" to="0" dur="1.2s" repeatCount="indefinite" />
    </line>
    <line x1="208" y1="150" x2="390" y2="185" stroke="#00f2fe" stroke-width="2" stroke-dasharray="10,5">
      <animate attributeName="stroke-dashoffset" from="30" to="0" dur="0.9s" repeatCount="indefinite" />
    </line>
    <line x1="208" y1="220" x2="390" y2="185" stroke="#00f2fe" stroke-width="2" stroke-dasharray="10,5">
      <animate attributeName="stroke-dashoffset" from="30" to="0" dur="1.1s" repeatCount="indefinite" />
    </line>
    <line x1="410" y1="115" x2="588" y2="150" stroke="#4facfe" stroke-width="2" stroke-dasharray="10,5">
      <animate attributeName="stroke-dashoffset" from="30" to="0" dur="1s" repeatCount="indefinite" />
    </line>
    <line x1="410" y1="185" x2="588" y2="150" stroke="#4facfe" stroke-width="2" stroke-dasharray="10,5">
      <animate attributeName="stroke-dashoffset" from="30" to="0" dur="1s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Text -->
  <text x="700" y="130" font-family="'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="3">
    50 DAYS OF
    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze" />
  </text>
  <text x="700" y="185" font-family="'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="5" filter="url(#glow)">
    MACHINE LEARNING
    <animate attributeName="opacity" values="0;1" dur="2.5s" fill="freeze" />
  </text>
  
  <text x="700" y="235" font-family="'Courier New', monospace" font-size="18" fill="#a0a0b0" text-anchor="middle" letter-spacing="2">
    Python | Scikit-Learn | Pandas | Matplotlib
    <animate attributeName="opacity" values="0;1" dur="3s" fill="freeze" />
  </text>
</svg>